<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .card {
        height: 200px;
        width: 200px;
        background-color: navy;
        position: relative;
      }

      .card img {
        width: 100%;
        height: 60%;
      }

      .card .icon {
        height: 30px;
        width: 30px;
        background-color: lightblue;
        border-radius: 100%;
        padding: 5px;
        position: absolute;
        top: 10px;
        right: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Positioning Elements</h1>

    <div class="card">
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWcEtZIj1iexwUJt-u0U3svK5_6s-i4eFGR6Cv7gVK2llL44cdaQcNAmI&s=10"
        alt=""
      />
      <div class="icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
          />
        </svg>
      </div>
    </div>
    <script>
      //   console.log("Hello world");
      //   console.warn("warning");
      //   console.error("danger");

      // DATA TYPES

      // 10 number
      // "xyz" string
      // true / false boolean
      // null
      // undefined

      // var, let, const

      //   keyword, variable name, assignment opr, variable value
      let userName = "abdullah";
      console.log(userName);

      //   console.log(10 + 10 * 2 - 10);
      //   console.log(10 + "10");

      let num1 = 10 + 10;
      let num2 = 10 + 5 + "10" + 2 * 10;

      console.log("num1:", num1);
      console.log("num2:", num2);

      console.log(20 - "10");

      console.log("sum of num1 and num2", num1 + num2);
    </script>
  </body>
</html>
